---
# ─────────────────────────────────────────────
#  Prometheus
# ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: org-mind
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers: []

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Auto-discover pods with annotation prometheus.io/scrape=true
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [org-mind]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # Explicit scrape for order-service (belt-and-suspenders)
      - job_name: 'order-service'
        static_configs:
          - targets: ['order-service.org-mind.svc.cluster.local:8000']
        metrics_path: /metrics
        scrape_interval: 10s

      # Qdrant metrics
      - job_name: 'qdrant'
        static_configs:
          - targets: ['qdrant.org-mind.svc.cluster.local:6333']
        metrics_path: /metrics

      # MCP server
      - job_name: 'mcp-server'
        static_configs:
          - targets: ['mcp-server.org-mind.svc.cluster.local:8080']
        metrics_path: /metrics

  alert_rules.yml: |
    groups:
      - name: order-service-alerts
        rules:
          - alert: OrderServiceHighErrorRate
            expr: |
              rate(order_service_errors_total[5m]) > 0.1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Order service error rate > 10%"
              description: "More than 10% of requests to order-service are failing."

          - alert: OrderServiceHighLatency
            expr: |
              histogram_quantile(0.95,
                rate(order_service_request_duration_seconds_bucket[5m])
              ) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Order service p95 latency > 2s"
              description: "95th percentile latency has exceeded 2 seconds."

          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="org-mind",condition="true"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: org-mind
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: org-mind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cluster-role
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: org-mind
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: org-mind
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: alert_rules.yml
                path: alert_rules.yml
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: org-mind
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: org-mind
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30909
---
# ─────────────────────────────────────────────
#  Grafana
# ─────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: org-mind
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: grafana_pass_2024
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: org-mind
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.org-mind.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: org-mind
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'org-mind'
        orgId: 1
        folder: 'Org-Mind'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-order-service
  namespace: org-mind
data:
  order-service.json: |
    {
      "title": "Order Service Dashboard",
      "uid": "order-service",
      "tags": ["org-mind", "order-service"],
      "timezone": "browser",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request Rate (req/s)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum(rate(order_service_requests_total[1m])) by (method, endpoint)",
            "legendFormat": "{{method}} {{endpoint}}",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 2, "type": "timeseries", "title": "Error Rate (5xx/s)",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum(rate(order_service_errors_total[1m]))",
            "legendFormat": "Errors/s",
            "datasource": {"uid": "prometheus"}
          }],
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "red"}}}
        },
        {
          "id": 3, "type": "timeseries", "title": "p50 / p95 / p99 Latency",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(order_service_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p50", "datasource": {"uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.95, rate(order_service_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95", "datasource": {"uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.99, rate(order_service_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p99", "datasource": {"uid": "prometheus"}
            }
          ]
        },
        {
          "id": 4, "type": "stat", "title": "Active Orders",
          "gridPos": {"x": 0, "y": 16, "w": 6, "h": 4},
          "targets": [{
            "expr": "order_service_active_orders",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 5, "type": "stat", "title": "Total Requests",
          "gridPos": {"x": 6, "y": 16, "w": 6, "h": 4},
          "targets": [{
            "expr": "sum(order_service_requests_total)",
            "datasource": {"uid": "prometheus"}
          }]
        }
      ],
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: org-mind
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: org-mind
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: grafana-admin-secret
          env:
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/order-service.json
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-order-service
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: org-mind
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: org-mind
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
